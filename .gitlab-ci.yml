image: node:24

stages:
  - build
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  SCIOREX_GIT_PROVIDER: gitlab
  SCIOREX_GIT_ORG: sciorex

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm
    - node_modules/

before_script:
  # Configure git to use CI token for accessing other GitLab repos (for shared-config)
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "git@gitlab.com:"
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "ssh://git@gitlab.com/"
  - npm ci

build:
  stage: build
  tags:
    - saas-linux-medium-amd64
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

deploy:
  stage: deploy
  tags:
    - saas-linux-medium-amd64
  dependencies:
    - build
  script:
    - npm install -g wrangler
    - wrangler pages deploy dist --project-name=sciorex-landing --branch=main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://sciorex.com
